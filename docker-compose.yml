services:
  postgres:
    image: postgres:16-alpine
    container_name: project-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_control
      # Money math is done in `numeric`; locale only affects sort order and messages.
      LANG: C.UTF-8
      TZ: Asia/Jakarta
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d project_control']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
